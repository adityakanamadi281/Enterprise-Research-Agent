[project]
name = "atlas-research-intelligence-agent" 
version = "0.1.0"
description = "Evidence-first research orchestration API for Atlas"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "httpx>=0.28,<0.29",
  "pypdf>=5.0,<6",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.18,<0.1",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.34,<0.35",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
